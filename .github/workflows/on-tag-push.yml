concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: Deploy Static Website

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-2

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.3
        with:
          role-to-assume: ${{ secrets.DEPLOY_GHA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Next.js build cache
        uses: actions/cache@v5
        with:
          path: services/website/.next/cache
          key: ${{ runner.os }}-next-cache-${{ hashFiles('pnpm-lock.yaml', 'services/website/app/**/*', 'services/website/content/**/*', 'services/website/public/**/*', 'services/website/.storybook/**/*') }}
          restore-keys: |
            ${{ runner.os }}-next-cache-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write website env
        run: |
          cat > services/website/.env.production <<EOF
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          EOF

      - name: Lint website
        run: pnpm lint

      - name: Test website
        run: pnpm test

      - name: Build static website
        run: pnpm build

      - name: Build Lambda handlers
        run: pnpm build:functions

      - name: Build Grafana dashboards
        run: pnpm build:grafana

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.5.7

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init --reconfigure \
            -backend-config="bucket=craig-watt-tfstate" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform apply
        working-directory: infra
        run: |
          terraform apply -auto-approve \
            -input=false \
            -lock-timeout=5m \
            -var="domain=craigwatt.co.uk" \
            -var="recaptcha_secret_key=${{ secrets.RECAPTCHA_SECRET_KEY }}" \
            -var="t212_api_key=${{ secrets.T212_API_KEY }}" \
            -var="t212_api_secret=${{ secrets.T212_API_SECRET }}" \
            -var="contact_email_to=${{ secrets.CONTACT_EMAIL_TO }}" \
            -var="contact_email_from=${{ secrets.CONTACT_EMAIL_FROM }}"

      - name: Rebuild Grafana dashboards with live AWS resource IDs
        working-directory: infra
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          export GRAFANA_WEBSITE_DOMAIN="craigwatt.co.uk"
          export GRAFANA_API_GATEWAY_ID="$(terraform output -raw api_id)"
          export GRAFANA_CLOUDFRONT_DISTRIBUTION_ID="$(terraform output -raw distribution_id)"
          cd ..
          pnpm build:grafana

      - name: Sync Grafana dashboards
        env:
          GRAFANA_SERVICE_ACCOUNT_TOKEN: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
        run: pnpm sync:grafana

      - name: Publish Grafana runtime link config
        working-directory: infra
        run: |
          export SITE_BUCKET_NAME="$(terraform output -raw site_bucket_name)"
          export DISTRIBUTION_ID="$(terraform output -raw distribution_id)"
          aws s3 cp \
            ../dist/grafana/website-runtime.json \
            "s3://${SITE_BUCKET_NAME}/runtime/grafana-links.json" \
            --content-type "application/json; charset=utf-8" \
            --cache-control "no-store, max-age=0"
          aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/runtime/grafana-links.json"
